<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card" style="text-align: center;">
            <div style="width: 64px; height: 64px; border-radius: var(--radius-full); background: rgba(239, 68, 68, 0.15); color: #ef4444; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
                <i data-lucide="alert-circle" style="width: 32px; height: 32px;"></i>
            </div>

            <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;" th:text="${errorCode != null ? errorCode : 'Something Went Wrong'}">Application Error</h1>
            <p class="text-muted" style="margin-bottom: 1.5rem; font-size: 0.95rem;" th:text="${errorMessage != null ? errorMessage : 'The requested resource could not be found or processed.'}">
                An unexpected condition was encountered.
            </p>

            <div style="display: flex; gap: 0.75rem; justify-content: center;">
                <a th:href="@{/home}" class="btn btn-primary">
                    <i data-lucide="home"></i>
                    <span>Back to Home</span>
                </a>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
