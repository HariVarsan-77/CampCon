<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <div th:replace="~{fragments/layout :: sidebar('notifications')}"></div>

        <div class="main-wrapper">
            <!-- Top Header -->
            <div th:replace="~{fragments/layout :: topHeader('Notifications')}"></div>

            <div th:replace="~{fragments/layout :: toasts}"></div>

            <main class="content-body" style="max-width: 800px; margin: 0 auto;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <div>
                        <h2>Activity Notifications</h2>
                        <p class="text-muted" style="font-size: 0.9rem;">Real-time alerts on your grievance submissions and management updates.</p>
                    </div>

                    <form th:if="${unreadNotifications != null and unreadNotifications > 0}"
                          th:action="@{/notifications/read-all}" method="post">
                        <button type="submit" class="btn btn-outline btn-sm">
                            <i data-lucide="check-check"></i>
                            <span>Mark All as Read</span>
                        </button>
                    </form>
                </div>

                <div class="card">
                    <div th:if="${notifications.empty}" class="empty-state">
                        <div class="empty-icon">
                            <i data-lucide="bell-off"></i>
                        </div>
                        <h3>No Notifications</h3>
                        <p>You're all caught up! New updates regarding your complaints will appear here.</p>
                    </div>

                    <div th:if="${!notifications.empty}" style="display: flex; flex-direction: column; gap: 0.75rem;">
                        <div th:each="n : ${notifications}"
                             style="padding: 1.1rem; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; transition: background var(--transition-fast);"
                             th:styleappend="${!n.read} ? 'background: rgba(212, 175, 55, 0.05); border-color: rgba(212, 175, 55, 0.3);' : 'background: var(--bg-input);'">
                            <div style="display: flex; gap: 0.85rem; align-items: flex-start;">
                                <div style="margin-top: 2px;">
                                    <i data-lucide="bell" style="width: 20px; height: 20px;"
                                       th:styleappend="${!n.read} ? 'color: var(--gold-primary);' : 'color: var(--text-dim);'"></i>
                                </div>
                                <div>
                                    <div style="font-weight: 600; font-size: 0.95rem; color: var(--text-main);" th:text="${n.title}">Notification Title</div>
                                    <div style="font-size: 0.88rem; color: var(--text-muted); margin-top: 0.15rem;" th:text="${n.message}">Message</div>
                                    <div style="font-size: 0.75rem; color: var(--text-dim); margin-top: 0.4rem;" th:text="${n.formattedCreatedAt}">Time</div>
                                </div>
                            </div>

                            <div style="display: flex; align-items: center; gap: 0.5rem;">
                                <a th:if="${n.link != null}" th:href="@{${n.link}}" class="btn btn-primary btn-sm">
                                    <span>View</span>
                                    <i data-lucide="arrow-right"></i>
                                </a>
                                <form th:if="${!n.read}" th:action="@{/notifications/{id}/read(id=${n.id})}" method="post">
                                    <button type="submit" class="icon-btn" title="Mark as Read">
                                        <i data-lucide="check"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
