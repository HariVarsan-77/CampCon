<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot Password')}"></head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div class="brand-logo" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;">CC</div>
                <h1 style="font-size: 1.75rem;">Reset Password</h1>
                <p class="text-muted" style="font-size: 0.9rem;">Enter your college email address to receive reset instructions</p>
            </div>

            <form th:action="@{/forgot-password}" method="post">
                <div class="form-group">
                    <label class="form-label" for="email">College Email Address</label>
                    <input type="email" id="email" name="email" class="form-control"
                           placeholder="e.g. yourname@campus.edu" required autofocus>
                    <span class="form-text">We'll verify your registration and dispatch a secure password reset link.</span>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">
                    <i data-lucide="mail"></i>
                    <span>Send Reset Link</span>
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem;">
                <a th:href="@{/login}" class="text-muted" style="font-size: 0.88rem; display: inline-flex; align-items: center; gap: 0.35rem;">
                    <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
                    <span>Back to Sign In</span>
                </a>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
