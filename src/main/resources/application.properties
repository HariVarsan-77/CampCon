spring.application.name=CampusConnect
server.port=8080

# File Upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Local storage directory for uploads (relative to project root)
campusconnect.storage.upload-dir=uploads

# Future Firebase/Supabase configuration placeholders
# campusconnect.storage.provider=local
# firebase.storage.bucket=your-project.appspot.com
# supabase.storage.url=https://your-project.supabase.co/storage/v1

